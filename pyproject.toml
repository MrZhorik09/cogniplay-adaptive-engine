[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogniplay-adaptive-engine"
version = "0.1.0"
description = "IRT-based adaptive difficulty engine for CogniPlay (cognitive-training gamified platform)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Zhubanysh Burlibayev" }]
dependencies = [
    "pandas>=1.5",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "flake8>=6.0"]

[project.scripts]
adaptive-engine = "adaptive_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist"]
